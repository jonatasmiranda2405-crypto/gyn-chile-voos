name: Atualizar preços e publicar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/index.html", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Buscar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FLIGHT_DATE: "2026-12-11"
          AFTER: "19:30"
        run: python3 scripts/fetch_prices.py
      - name: Salvar data.json
        run: |
          git config user.name "precos-bot"
          git config user.email "precos-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Atualiza preços"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
